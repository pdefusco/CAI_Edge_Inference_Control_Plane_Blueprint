[project]
name = "lighthouse-contracts"
version = "0.1.0"
description = "Shared wire contracts between the Lighthouse control plane and the keeper edge agent"
# 3.10 is real, not aspirational: `enums.py` falls back to a `(str, Enum)`
# subclass with `__str__ = str.__str__` when `enum.StrEnum` is missing, and
# `edge-agent/tests/test_enums_strenum_parity.py` asserts the two are
# indistinguishable. Both suites are run under a real 3.10 interpreter before
# this floor is allowed to say 3.10 -- it briefly claimed 3.10 while importing
# `enum.StrEnum` unconditionally, which installed cleanly and then raised
# ImportError at first import.
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lighthouse_contracts"]
