[project]
name = "lighthouse"
version = "0.1.0"
description = "Edge model governance control plane, running as a Cloudera AI Application"
# 3.11 is load-bearing here, unlike `contracts` and `edge-agent` which really do
# run on 3.10. Verified by running this suite under a real 3.10 interpreter
# 2026-10-04: 3 failures, all one root cause. `datetime.fromisoformat` only
# learned to accept a trailing "Z" in 3.11, and the registry sends exactly that
# ("2026-10-04T00:45:28.441Z"), so on 3.10:
#
#   * `registry/cai.py:518` fails to parse `created_at`, which does NOT raise --
#     it collapses `version_uuid` to the bare version number and silently
#     disables reissue-drift detection, leaving devices on stale cached bytes;
#   * `util.py:43` fails on stored session timestamps, so a live dashboard
#     session reads as invalid and every request 401s.
#
# Do not lower this floor. If the control plane ever has to run on 3.10,
# normalise the "Z" to "+00:00" before parsing at both sites first, and make the
# parse failure loud rather than silent.
requires-python = ">=3.11"
dependencies = [
    "lighthouse-contracts",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Only needed by the real CAI adapter (M2). Kept out of the base install so the
# local harness has no cloud dependencies at all.
#
# `boto3` was here until M3 and is deliberately gone. It was provisional: if the
# registry's `/versions/{v}/artifact` route had redirected to presigned object
# storage, the control plane would have needed an object-store identity of its
# own. Measured against a real tenant 2026-10-04, that route answers 200 with
# `application/octet-stream` and gzip magic -- no redirect, so no S3 client and
# no second credential. Re-add it only if a tenant is observed redirecting, and
# note that `registry/base.py:5` forbids importing it above the adapter anyway.
cai = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
lighthouse = "lighthouse.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lighthouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error::DeprecationWarning",
  # Starlette wants `httpx2` for its TestClient. Taking that dependency to silence
  # one import-time notice is not worth it: TestClient-over-httpx is what gives the
  # end-to-end test a *synchronous* ASGI transport, which is the only reason the
  # real edge agent can drive the real app in one process. Narrowly scoped so it
  # cannot hide any other Starlette warning.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
