[project]
name = "keeper"
version = "0.1.0"
description = "Lighthouse edge agent: reconciles local model deployment against CAI desired state"
# 3.10 because the Jetson is 3.10. JetPack 6 ships Python 3.10 and NVIDIA's
# accelerated aarch64 onnxruntime wheels are built against it, so requiring 3.11
# here would mean building onnxruntime from source on-device or giving up the GPU
# on a device bought for its GPU.
#
# This is only true because `contracts/enums.py` carries a StrEnum fallback.
# Before that fallback existed, this floor said 3.10 while the dependency chain
# needed 3.11: `pip install keeper` on 3.10 succeeded without a word and
# `from keeper.main import run` then raised ImportError. If you ever add a 3.11+
# API to this package or to `contracts`, raise BOTH floors in the same commit --
# pip's check is the only thing standing between a 3.10 device and that crash.
requires-python = ">=3.10"
# Deliberately minimal. This installs on a Jetson, so it must not drag in
# FastAPI, boto3 or anything else the control plane needs.
dependencies = [
    "lighthouse-contracts",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The real runtime, installed on the device in M4. On Jetson this comes from
# NVIDIA's wheel index rather than PyPI, so it is not a base dependency.
onnx = [
    "onnxruntime>=1.17",
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
keeper = "keeper.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "onnx: needs the real onnxruntime wheel and is deselected by default (make test-agent-onnx)",
]
# Tier 2 is opt-in, not opportunistic. `make test` has to mean the same thing on
# every machine, and a suite whose membership depends on what happens to be
# pip-installed gives two developers different answers to the same command --
# with the one that has the wheel being the only one who sees a tier-2 failure.
# Deselecting by default also means the marker, not an `importorskip`, is what
# keeps the wheel off the laptop dependency list.
#
# `make test-agent-onnx` passes its own `-m onnx`, which wins: pytest keeps only
# the last `-m` it is given. Verified rather than assumed -- an earlier draft
# tried `-m "onnx"` expecting the two to AND together, which selects nothing and
# looks exactly like a suite that is passing.
addopts = "-m 'not onnx'"
